<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roamie - Place Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-brand">
                <img src="{{ url_for('static', filename='assets/roamielg.png') }}" alt="Roamie Logo" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-text">
                    <h2>Roamie</h2>
                    <small>Local Place Finder</small>
                </div>
            </div>
            <span class="status-dot"></span>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Hello! I'm Roamie, your local place finder. May I know your name?</div>
        </div>
        <form class="chat-input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Type your query here..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
